name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: sanitizer / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tsan
            flags: -fsanitize=thread
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      # Recent runner kernels use high mmap ASLR entropy, which breaks TSan/ASan.
      - name: Reduce ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DTP_WARNINGS_AS_ERRORS=ON
          -DTP_BUILD_EXAMPLES=OFF
          -DTP_BUILD_BENCHMARKS=OFF
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"
          "-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.flags }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  integration:
    name: integration (consume as package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and install library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DTP_BUILD_TESTS=OFF -DTP_BUILD_EXAMPLES=OFF -DTP_BUILD_BENCHMARKS=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$RUNNER_TEMP/tp-install"
          find "$RUNNER_TEMP/tp-install" -type f | sort

      - name: Consumer via find_package
        run: |
          cmake -S tests/consumer -B consumer-find -DTP_CONSUME_MODE=find_package \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tp-install"
          cmake --build consumer-find --parallel
          ./consumer-find/consumer

      - name: Consumer via add_subdirectory
        run: |
          cmake -S tests/consumer -B consumer-subdir -DTP_CONSUME_MODE=subdirectory \
            -DTP_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build consumer-subdir --parallel
          ./consumer-subdir/consumer

      - name: Consumer via FetchContent
        run: |
          cmake -S tests/consumer -B consumer-fetch -DTP_CONSUME_MODE=fetchcontent \
            -DTP_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build consumer-fetch --parallel
          ./consumer-fetch/consumer

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Unit tests run inside the image build; a failing test fails this step.
      - name: Build image
        run: docker build -t tp-thread-pool .

      - name: Run demo container
        run: timeout 120s docker run --rm tp-thread-pool
